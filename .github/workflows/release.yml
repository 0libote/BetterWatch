name: Release Chrome extension

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and run tests
        run: npm run check

      - name: Build and validate Chrome package
        run: npm run build

      - name: Create package checksum
        working-directory: dist
        run: sha256sum betterwatch-chrome.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/betterwatch-chrome.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/betterwatch-chrome.zip dist/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
