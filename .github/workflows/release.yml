name: Release Chrome extension

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync extension version to release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:sync

      - name: Verify release tag and extension version agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:check

      - name: Check types and run tests
        run: bun run check

      - name: Build and validate Chrome package
        run: bun run build

      - name: Verify release ZIP and preview server
        run: |
          bun run package:check
          bun run smoke:preview

      - name: Generate release description
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:notes

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/betterwatch-chrome.zip dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              dist/betterwatch-chrome.zip dist/SHA256SUMS \
              --verify-tag --title "BetterWatch $RELEASE_TAG" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Push version sync commit to default branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- package.json CHANGELOG.md)" ]; then
            echo 'Version files already agree with the tag; nothing to push.'
            exit 0
          fi
          # The tag checkout is detached, so discard the working-tree sync and
          # re-apply it on top of the latest default branch instead.
          git stash push -m "release version sync for $RELEASE_TAG" -- package.json CHANGELOG.md \
            || git checkout -- package.json CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          bun scripts/sync-release-version.ts --no-downgrade
          if [ -z "$(git status --porcelain -- package.json CHANGELOG.md)" ]; then
            echo 'Default branch is already ahead of the tag; nothing to push.'
            exit 0
          fi
          git add package.json CHANGELOG.md
          git commit -m "chore(release): sync extension version to $RELEASE_TAG" \
            -m 'Applied by the tag release workflow so package.json and CHANGELOG.md agree with the published tag.'
          git push origin "HEAD:$DEFAULT_BRANCH" \
            || echo '::warning::Published the release but could not push the version sync commit; sync it manually.'
