name: Release Chrome extension

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag and extension version agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:check

      - name: Check types and run tests
        run: bun run check

      - name: Build and validate Chrome package
        run: bun run build

      - name: Verify release ZIP and preview server
        run: |
          bun run package:check
          bun run smoke:preview

      - name: Generate release description
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:notes

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/betterwatch-chrome.zip dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              dist/betterwatch-chrome.zip dist/SHA256SUMS \
              --verify-tag --title "BetterWatch $RELEASE_TAG" \
              --notes-file dist/RELEASE_NOTES.md
          fi
